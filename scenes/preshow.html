<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>署名 · 预演</title>
  <link rel="preload" href="../assets/fonts/subset/NotoSerifSC.woff2" as="font" type="font/ttf" crossorigin />
  <link rel="stylesheet" href="../css/base.css" />
  <link rel="stylesheet" href="../css/preshow.css" />
</head>
<body>
  <div class="stage" id="stage">
    <main class="scene preshow" data-cue="0">
      <div class="layer bg pre-backdrop"></div>
      <div class="layer bg pre-haze"></div>

      <div class="pre-paper" aria-hidden="true">
        <div class="pre-paper-inner">
          <div class="pre-paper-head">
            <span>JINR · DUBNA</span>
            <span>PREPRINT / 1959</span>
          </div>
          <div class="pre-paper-rule"></div>
          <div class="pre-paper-title">On the possibility<br />of a name</div>
          <div class="pre-paper-lines">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <div class="pre-paper-sign">
            <span class="pre-signature">周光召</span>
            <span class="pre-signature-rule"></span>
          </div>
          <div class="pre-page-no">37</div>
        </div>
      </div>

      <div class="pre-vignette"></div>
      <canvas class="fx-canvas pre-dust" id="dust"></canvas>

      <div class="pre-copy">
        <div class="pre-org">致知科学社 · 2026 社团风采展</div>
        <div class="pre-title-wrap">
          <h1 class="pre-title">署名</h1>
          <div class="pre-title-annot">
            <span class="pre-red-dot"></span>
            <span>五幕话剧</span>
            <span>约 8 分钟</span>
          </div>
        </div>
        <div class="pre-rule"></div>
        <p class="pre-quote">他把自己的名字从论文上摘下来，<br />写进了国家的名单里。</p>
      </div>

      <div class="pre-footer">
        <div class="pre-footer-left">
          <span>509 报告厅</span>
          <span class="pre-footer-sep"></span>
          <span>6 + 1 位演员</span>
        </div>
        <div class="pre-footer-right">请将手机调至静音 · 感谢观看</div>
      </div>

      <div class="pre-side-note">
        <span>1959</span><span>1964</span><span>2024</span>
      </div>

      <span class="reg-mark tl"></span>
      <span class="reg-mark tr"></span>
      <span class="reg-mark bl"></span>
      <span class="reg-mark br"></span>
      <div class="grain"></div>
      <div class="vignette"></div>
      <div class="film-edge"></div>
    </main>
  </div>

  <script src="../js/scene-core.js"></script>
  <script src="../js/preshow.js"></script>
</body>
</html>
