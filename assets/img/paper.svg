<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">
  <filter id="paper">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.014" numOctaves="4" seed="8" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.34"/>
    </feComponentTransfer>
  </filter>
  <filter id="fibers">
    <feTurbulence type="fractalNoise" baseFrequency="0.7 0.06" numOctaves="2" seed="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer>
      <feFuncA type="table" tableValues="0 0.2"/>
    </feComponentTransfer>
  </filter>
  <rect width="600" height="600" filter="url(#paper)" opacity="0.75"/>
  <rect width="600" height="600" filter="url(#fibers)" opacity="0.45"/>
</svg>
